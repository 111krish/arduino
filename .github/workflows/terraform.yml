name: Terraform

on:
  pull_request:
    paths:
      - "terraform/**"
  push:
    branches: [main]
    paths:
      - "terraform/**"
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [staging, production]
      action:
        description: Terraform action
        required: true
        type: choice
        options: [plan, apply, destroy]

jobs:
  terraform-validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive terraform/

      - name: Validate each module
        run: |
          for module in terraform/modules/*/; do
            echo "Validating ${module}"
            cd "${module}"
            terraform init -backend=false
            terraform validate
            cd -
          done

  terraform-plan:
    name: Plan (${{ inputs.environment || 'staging' }})
    runs-on: ubuntu-latest
    needs: terraform-validate
    environment: ${{ inputs.environment || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform/environments/${{ inputs.environment || 'staging' }}
        run: terraform init

      - name: Terraform Plan
        id: plan
        working-directory: terraform/environments/${{ inputs.environment || 'staging' }}
        run: terraform plan -out=tfplan -no-color

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.environment || 'staging' }}
          path: terraform/environments/${{ inputs.environment || 'staging' }}/tfplan
          retention-days: 1

  terraform-apply:
    name: Apply (${{ inputs.environment }})
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
    environment: ${{ inputs.environment || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.environment || 'staging' }}
          path: terraform/environments/${{ inputs.environment || 'staging' }}

      - name: Terraform Init
        working-directory: terraform/environments/${{ inputs.environment || 'staging' }}
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform/environments/${{ inputs.environment || 'staging' }}
        run: terraform apply tfplan
